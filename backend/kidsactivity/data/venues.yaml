  # ============================================================
  # Museums
  # ============================================================
  # Kohl Children's Museum (Glenview) — small daily-schedule page with
  # `.event-pod` cards covering the current Special Exhibit + flagship
  # recurring programs (Books and Bops, Art Adventures). Each `.event-pod`
  # IS the link, so url is read off the item's own `@href`. Special
  # Exhibits carry a date-range string (`January 24 – May 10`), recurring
  # programs are open-ended.
  - slug: kohlchildrens
    name: Kohl Children's Museum
    venue_type: museum
    platform: custom_html
    base_url: https://www.kohlchildrensmuseum.org/
    center_lat: 42.0747
    center_lon: -87.7747
    served_zipcodes: ["60026", "60025", "60093", "60043"]
    custom_config:
      listing_url: https://www.kohlchildrensmuseum.org/visit/calendar/
      item_selector: "a.event-pod"
      fields:
        name: "h3"
        url: "@href"
        date_range_text: "p.date-time"
        description: ".desc"
      default_age:
        min_months: 24
        max_months: 144
