# Venue catalog. Add new entries by appending; if a venue uses an existing
# platform (activenet / webtrac / amilia / biblio_commons / library_calendar /
# communico / custom_html), no code change is needed. For a brand-new
# platform, drop a scraper into kidsactivity/scrapers/ and register it in
# scrapers/__init__.py::PLATFORM_SCRAPERS.
#
# Required fields per venue:
#   slug, name, venue_type, platform, base_url, center_lat, center_lon
# Optional:
#   sitecode (WebTrac), amilia_org_slug (Amilia), search_url, served_zipcodes,
#   aliases, custom_config (CUSTOM_HTML)
#
# venue_type ∈ {park_district, library, community_center, museum}

venues:
