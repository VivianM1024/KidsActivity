  # ============================================================
  # Libraries
  # ============================================================
  # Glenview Public Library — BiblioCommons v2.
  # The audience_ids below are tenant-specific MongoDB IDs surfaced by the
  # /v2/events page when you click an audience filter; lift them from the
  # ?audiences= query string on the public events page.
  - slug: glenviewpl
    name: Glenview Public Library
    venue_type: library
    platform: biblio_commons
    base_url: https://glenviewpl.bibliocommons.com/
    center_lat: 42.0697
    center_lon: -87.7878
    custom_config:
      audience_ids:
        - "630f73dc96317542000ec2f0"  # Birth to 5
        - "630f73c92f32903000449b34"  # Kids (Grades K-8)
        - "62cedbbea627452f0046a67c"  # Teens (Grades 9-12)

  # Winnetka-Northfield Public Library District — server-rendered Drupal
  # theme using `lc-event` / `event-card` classes (the "Library Calendar"
  # node type). Pagination via `?page=0..N` (Drupal-style, zero-indexed).
  - slug: wnpld
    name: Winnetka-Northfield Public Library District
    venue_type: library
    platform: custom_html
    base_url: https://www.wnpld.org/
    center_lat: 42.1081
    center_lon: -87.7356
    served_zipcodes: ["60093", "60043", "60082"]
    custom_config:
      listing_url: https://www.wnpld.org/events/upcoming
      pagination:
        param: page
        start: 0
        max_pages: 6
      item_selector: "article.event-card"
      fields:
        # The aria-label on the title link carries the canonical
        # "Tuesday, May 5, 2026 @ 9:30am" — picked up by the blob scan.
        name: "h3.lc-event__title a"
        url: "h3.lc-event__title a@href"
        time_text: ".lc-event-info-item--time"
        audience_text: ".lc-event-info__item--colors"
        location_text: ".lc-event-info__item--categories"
      audience_filter:
        - babies
        - toddlers
        - preschoolers
        - kids
        - school age
        - tweens
        - teens
        - family
        - children
      exclude_terms: ["adults only"]

  # Evanston Public Library — BiblioCommons v2. Audience IDs lifted from
  # the live filter URLs at evanstonlibrary.bibliocommons.com/v2/events.
  - slug: epl
    name: Evanston Public Library
    venue_type: library
    platform: biblio_commons
    base_url: https://evanstonlibrary.bibliocommons.com/
    center_lat: 42.0451
    center_lon: -87.6877
    served_zipcodes: ["60201", "60202", "60203"]
    custom_config:
      audience_ids:
        - "6696ef2fd8f18e5758124ff0"  # Babies & Toddlers
        - "6696ef5fe3e1ee300048b71b"  # Kids K-2
        - "664cce641e57af2800453c7b"  # Kids 3-5
        - "664cce671e57af2800453c97"  # Teens 6-12

