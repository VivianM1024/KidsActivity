[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kidsactivity"
version = "0.1.0"
description = "Weekly kids-activity scraper feeding a static-JSON iOS app"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "curl_cffi>=0.7",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "pgeocode>=0.5",
    "diskcache>=5.6",
    "tenacity>=8.2",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]

[project.scripts]
kidsactivity = "kidsactivity.cli:app"

[tool.setuptools.packages.find]
include = ["kidsactivity*"]

[tool.setuptools.package-data]
kidsactivity = ["data/*.yaml"]
